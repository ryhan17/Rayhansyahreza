<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Matematika</title>
<script>try{var t=localStorage.getItem('tema');if(t)document.documentElement.setAttribute('data-tema',t);}catch(e){}</script>
<style>
:root{--paper:#F5F5F2;--ink:#111;--muted:#6E6E69;--line:#D4D4CE;--accent:#E30613;color-scheme:light}
:root[data-tema="dark"]{--paper:#0F0F0E;--ink:#F2F2EE;--muted:#98988F;--line:#2D2D2A;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-tema="light"]){--paper:#0F0F0E;--ink:#F2F2EE;--muted:#98988F;--line:#2D2D2A;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:17px/1.6 "Helvetica Neue",Helvetica,Arial,sans-serif;padding:clamp(20px,4vw,56px);max-width:860px;margin:0 auto}
a{color:inherit}h1{font-size:clamp(2.6rem,9vw,6rem);line-height:.9;letter-spacing:-.05em;margin:12px 0 20px;padding-bottom:20px;border-bottom:3px solid var(--ink)}
.label{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ket{color:var(--muted);max-width:52ch;margin-bottom:24px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button{font:inherit;color:inherit;background:transparent;cursor:pointer}
.bm-contoh{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.bm-contoh button{font-size:.92rem;border:1.5px solid var(--ink);border-radius:99px;padding:4px 16px}
.bm-contoh button:hover{background:var(--ink);color:var(--paper)}
.bm-log{min-height:36vh;max-height:56vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:20px 0;border-top:1.5px solid var(--ink)}
.bm-m{max-width:88%;padding:2px 0 2px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bm-b{align-self:flex-start;border-left:3px solid var(--accent)}
.bm-u{align-self:flex-end;border-left:3px solid var(--ink);color:var(--muted)}
form{display:flex;gap:12px;align-items:flex-end;padding-top:16px;border-top:3px solid var(--ink)}
input{flex:1;min-width:0;font:inherit;color:inherit;background:transparent;border:0;border-bottom:1.5px solid var(--ink);padding:8px 2px;border-radius:0}
.bm-kirim{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:99px;padding:6px 22px}
.bm-kirim:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
small{display:block;margin-top:32px;color:var(--muted)}
</style>
</head>
<body>
<a class="label" href="../index.html#program">← Kembali ke portofolio</a>
<h1>Bot Matematika</h1>
<p class="ket">Ketik hitungan, persen, atau persamaan dengan x. Bot menjawab beserta langkahnya.</p>
<div id="bot">
  <div class="bm-contoh" aria-label="Contoh soal">
    <button type="button">2x + 5 = 15</button>
    <button type="button">x^2 - 5x + 6 = 0</button>
    <button type="button">15% dari 240</button>
    <button type="button">sqrt(144) + 2^5</button>
  </div>
  <div class="bm-log" id="bm-log" aria-live="polite">
    <div class="bm-m bm-b">Halo! Coba ketik soal di bawah, atau pilih contoh.</div>
  </div>
  <form id="bm-f">
    <input id="bm-i" maxlength="200" autocomplete="off" placeholder="Tulis soal matematika…" aria-label="Soal matematika" required>
    <button class="bm-kirim" id="bm-k" type="submit">Kirim</button>
  </form>
</div>
<small>Berjalan sepenuhnya di browser memakai math.js, tanpa server. Mendukung persamaan linear dan kuadrat dengan satu variabel x.</small>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.2.0/math.min.js"></script>
<script>
/* Bot matematika (berjalan di browser, tanpa server) */
(function(){
  function fmt(n){var s=math.format(n,{precision:8});return s==='-0'?'0':s;}
  function bentuk(a,b,c){
    var t=[];
    if(a)t.push((a===1?'':a===-1?'−':fmt(a))+'x^2');
    if(b)t.push((t.length?(b<0?' − ':' + '):(b<0?'−':''))+(Math.abs(b)===1?'':fmt(Math.abs(b)))+'x');
    if(c||!t.length)t.push((t.length?(c<0?' − ':' + '):(c<0?'−':''))+fmt(Math.abs(c)));
    return t.join('')+' = 0';
  }
  function persamaan(teks){
    var p=teks.split('=');
    if(p.length!==2||!/x/i.test(teks))return null;
    var f=function(x){return math.evaluate('('+p[0]+')-('+p[1]+')',{x:x});};
    var c=f(0),u=f(1),m=f(-1),a=(u+m)/2-c,b=(u-m)/2;
    var ok=function(x,y){return Math.abs(y-(a*x*x+b*x+c))<1e-7*(1+Math.abs(y));};
    if(!ok(2,f(2))||!ok(3,f(3))||!ok(-2,f(-2)))return 'Bentuk persamaan ini belum didukung. Gunakan persamaan linear atau kuadrat dengan satu variabel x.';
    var s='Bentuk standar: '+bentuk(a,b,c)+'\n';
    if(Math.abs(a)<1e-9){
      if(Math.abs(b)<1e-9)return s+(Math.abs(c)<1e-9?'Semua nilai x memenuhi.':'Tidak ada nilai x yang memenuhi.');
      return s+'x = −('+fmt(c)+') ÷ '+fmt(b)+'\nJawaban: x = '+fmt(-c/b);
    }
    var D=b*b-4*a*c;
    s+='Diskriminan D = b² − 4ac = '+fmt(D)+'\n';
    if(D<-1e-9)return s+'D < 0, tidak ada akar real.';
    if(Math.abs(D)<1e-9)return s+'D = 0, satu akar kembar.\nJawaban: x = '+fmt(-b/(2*a));
    var r=Math.sqrt(D);
    return s+'x = (−b ± √D) ÷ 2a\nJawaban: x = '+fmt((-b+r)/(2*a))+' atau x = '+fmt((-b-r)/(2*a));
  }
  function ekspresi(teks){
    var t=teks.replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.')
      .replace(/([\d.]+)\s*%\s*dari\s*([\d.]+)/i,'($1/100)*($2)');
    var h=math.evaluate(t);
    if(typeof h==='function'||h===undefined)return null;
    return t+' = '+math.format(h,{precision:10});
  }
  function jawab(teks){
    if(!window.math)return 'Pustaka math.js belum termuat. Periksa koneksi internet lalu muat ulang halaman.';
    try{
      if(teks.indexOf('=')>-1){var r=persamaan(teks);if(r)return r;}
      else if(/^[\d\s+\-*/^().,%×÷a-z]+$/i.test(teks)&&/\d/.test(teks)){var e=ekspresi(teks);if(e)return e;}
    }catch(err){}
    return 'Belum bisa mengerti soal ini. Coba hitungan (12*(1-1/3)), persen (15% dari 240), atau persamaan dengan x (2x + 5 = 15).';
  }
  var log=document.getElementById('bm-log'),f=document.getElementById('bm-f'),inp=document.getElementById('bm-i');
  function tambah(teks,k){var d=document.createElement('div');d.className='bm-m '+k;d.textContent=teks;log.appendChild(d);log.scrollTop=log.scrollHeight;}
  function kirim(teks){tambah(teks,'bm-u');tambah(jawab(teks),'bm-b');}
  f.addEventListener('submit',function(e){e.preventDefault();var t=inp.value.trim();if(t){inp.value='';kirim(t);}inp.focus();});
  document.querySelectorAll('#bot .bm-contoh button').forEach(function(b){b.addEventListener('click',function(){kirim(b.textContent);});});
})();
</script>
</body>
</html>
